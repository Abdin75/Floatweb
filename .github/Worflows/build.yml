name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: unzip -q floatweb.zip -d src
      - name: Build
        run: gradle --no-daemon -p src/floatweb assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: floatweb-apk
          path: src/floatweb/app/build/outputs/apk/debug/app-debug.apk
